apiVersion: apps/v1

kind: Deployment

metadata:
  name: backend
  namespace: mlops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

      - name: backend

        image: backend-local:latest

        imagePullPolicy: Never

        ports:
        - containerPort: 5000

        env:

        - name: MYSQL_HOST
          value: mysql

        - name: MYSQL_PORT
          value: "3306"

        - name: MYSQL_USER
          value: root

        - name: MYSQL_PASSWORD
          value: password

        - name: MYSQL_DATABASE
          value: healthdb