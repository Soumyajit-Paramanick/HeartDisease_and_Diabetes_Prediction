services:

  frontend:
    build: ./frontend

    container_name: frontend_container

    ports:
      - "5173:5173"

  backend:
    build: ./backend

    container_name: backend_container

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    depends_on:
      - mysql

  mysql:
    image: mysql:8

    container_name: mysql_container

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: healthdb

    volumes:
      - mysql_data:/var/lib/mysql

  nginx:
    build: ./nginx

    container_name: nginx_container

    ports:
      - "80:80"

    depends_on:
      - frontend
      - backend

volumes:
  mysql_data: