apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Values.backend.name }}
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.backend.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.backend.name }}

  template:
    metadata:
      labels:
        app: {{ .Values.backend.name }}

    spec:
      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: {{ .Values.backend.name }}

          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"

          imagePullPolicy: Always

          ports:
            - containerPort: {{ .Values.backend.containerPort }}

          env:
            - name: MYSQL_HOST
              value: mysql

            - name: MYSQL_PORT
              value: "3306"

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE

          startupProbe:
            httpGet:
              path: /api/health
              port: 5000

            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000

            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000

            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5

          resources:
            requests:
              cpu: {{ .Values.backend.resources.requests.cpu }}
              memory: {{ .Values.backend.resources.requests.memory }}

            limits:
              cpu: {{ .Values.backend.resources.limits.cpu }}
              memory: {{ .Values.backend.resources.limits.memory }}