apiVersion: apps/v1

kind: Deployment

metadata:
  name: {{ .Values.mysql.name }}
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.mysql.replicas }}

  selector:
    matchLabels:
      app: {{ .Values.mysql.name }}

  template:

    metadata:
      labels:
        app: {{ .Values.mysql.name }}

    spec:

      containers:

      - name: {{ .Values.mysql.name }}

        image: {{ .Values.mysql.image }}

        ports:
        - containerPort: {{ .Values.mysql.containerPort }}

        env:

        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD

        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_DATABASE

        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql

        resources:
          requests:
            cpu: {{ .Values.mysql.resources.requests.cpu }}
            memory: {{ .Values.mysql.resources.requests.memory }}

          limits:
            cpu: {{ .Values.mysql.resources.limits.cpu }}
            memory: {{ .Values.mysql.resources.limits.memory }}

      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc