apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: mlops-ingress
  namespace: {{ .Values.namespace }}

spec:
  ingressClassName: nginx

  rules:
    - host: {{ .Values.ingress.host }}

      http:
        paths:

          - path: /api
            pathType: Prefix

            backend:
              service:
                name: backend
                port:
                  number: 5000

          - path: /
            pathType: Prefix

            backend:
              service:
                name: frontend
                port:
                  number: 80