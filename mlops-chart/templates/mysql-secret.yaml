apiVersion: v1

kind: Secret

metadata:
  name: mysql-secret
  namespace: {{ .Values.namespace }}

type: Opaque

stringData:

  MYSQL_ROOT_PASSWORD: {{ .Values.secret.mysqlRootPassword }}

  MYSQL_USER: {{ .Values.secret.mysqlUser }}

  MYSQL_PASSWORD: {{ .Values.secret.mysqlPassword }}

  MYSQL_DATABASE: {{ .Values.secret.mysqlDatabase }}