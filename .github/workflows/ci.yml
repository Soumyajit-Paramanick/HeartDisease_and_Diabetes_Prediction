name: CI Pipeline

on:
  push:
    branches:
      - kubernetes-clean-setup

  pull_request:
    branches:
      - kubernetes-clean-setup

jobs:

  backend-checks:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: |
        pip install -r requirements.txt

    - name: Download ML Models
      working-directory: ./backend
      run: |
        python -c "from utils.download_models import download_models; download_models()"

    - name: Backend Import Test
      working-directory: ./backend

      env:
        MYSQL_HOST: localhost
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: password
        MYSQL_DATABASE: healthdb

      run: |
        python -c "from app import app"

  docker-build:

    runs-on: ubuntu-latest

    needs: backend-checks

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Git Commit SHA
      run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Build Backend Docker Image
      run: |
        docker build -t backend:${IMAGE_TAG} ./backend

    - name: Build Frontend Docker Image
      run: |
        docker build -t frontend:${IMAGE_TAG} ./frontend

    - name: Verify Docker Images
      run: |
        docker images

  helm-validation:

    runs-on: ubuntu-latest

    needs: docker-build

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Helm
      uses: azure/setup-helm@v4

    - name: Validate Helm Chart
      run: |
        helm lint ./mlops-chart