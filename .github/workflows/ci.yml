name: CI Pipeline

on:
  push:
    branches:
      - kubernetes-clean-setup

  pull_request:
    branches:
      - kubernetes-clean-setup

jobs:

  backend-checks:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Backend Dependencies
      working-directory: ./backend
      run: |
        pip install -r requirements.txt

    - name: Download ML Models
      working-directory: ./backend
      run: |
        python -c "from utils.download_models import download_models; download_models()"

    - name: Backend Import Test
      working-directory: ./backend
      env:
        MYSQL_HOST: localhost
        MYSQL_PORT: 3306
        MYSQL_USER: root
        MYSQL_PASSWORD: password
        MYSQL_DATABASE: healthdb
      run: |
        python -c "from app import app"

  docker-build:

    runs-on: ubuntu-latest

    needs: backend-checks

    outputs:
      image_tag: ${{ steps.git_sha.outputs.image_tag }}

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set Git Commit SHA
      id: git_sha
      run: |
        echo "image_tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
        echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

    # BACKEND

    - name: Build Backend Docker Image
      run: |
        docker build -t backend:${IMAGE_TAG} ./backend

    - name: Tag Backend Image
      run: |
        docker tag backend:${IMAGE_TAG} \
        920687103858.dkr.ecr.us-east-1.amazonaws.com/backend-heartdisease-and-diabetes-prediction:${IMAGE_TAG}

        docker tag backend:${IMAGE_TAG} \
        920687103858.dkr.ecr.us-east-1.amazonaws.com/backend-heartdisease-and-diabetes-prediction:latest

    - name: Push Backend Image
      run: |
        docker push 920687103858.dkr.ecr.us-east-1.amazonaws.com/backend-heartdisease-and-diabetes-prediction:${IMAGE_TAG}

        docker push 920687103858.dkr.ecr.us-east-1.amazonaws.com/backend-heartdisease-and-diabetes-prediction:latest

    # FRONTEND

    - name: Build Frontend Docker Image
      run: |
        docker build -t frontend:${IMAGE_TAG} ./frontend

    - name: Tag Frontend Image
      run: |
        docker tag frontend:${IMAGE_TAG} \
        920687103858.dkr.ecr.us-east-1.amazonaws.com/frontend-heartdisease-and-diabetes-prediction:${IMAGE_TAG}

        docker tag frontend:${IMAGE_TAG} \
        920687103858.dkr.ecr.us-east-1.amazonaws.com/frontend-heartdisease-and-diabetes-prediction:latest

    - name: Push Frontend Image
      run: |
        docker push 920687103858.dkr.ecr.us-east-1.amazonaws.com/frontend-heartdisease-and-diabetes-prediction:${IMAGE_TAG}

        docker push 920687103858.dkr.ecr.us-east-1.amazonaws.com/frontend-heartdisease-and-diabetes-prediction:latest

    - name: Verify Docker Images
      run: docker images

  helm-validation:

    runs-on: ubuntu-latest

    needs: docker-build

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Helm
      uses: azure/setup-helm@v4

    - name: Validate Helm Chart
      run: |
        helm lint ./mlops-chart