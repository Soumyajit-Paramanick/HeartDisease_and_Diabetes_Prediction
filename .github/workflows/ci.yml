name: CI/CD Pipeline

on:
  push:
    branches:
      - kubernetes-clean-setup

    paths-ignore:
      - 'mlops-chart/values.yaml'

  pull_request:
    branches:
      - kubernetes-clean-setup

permissions:
  contents: write

jobs:

  # ==========================================
  # SONARCLOUD CODE ANALYSIS
  # ==========================================

  sonarcloud-analysis:

    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Soumyajit-Paramanick_HeartDisease_and_Diabetes_Prediction
            -Dsonar.organization=soumyajit-paramanick
            -Dsonar.sources=.
            -Dsonar.python.version=3.13

  # ==========================================
  # BACKEND CHECKS
  # ==========================================

  backend-checks:

    runs-on: ubuntu-latest
    needs: sonarcloud-analysis

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          pip install -r requirements.txt

      - name: Download ML Models
        working-directory: ./backend
        run: |
          python -c "from utils.download_models import download_models; download_models()"

      - name: Backend Import Test
        working-directory: ./backend
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: password
          MYSQL_DATABASE: healthdb
        run: |
          python -c "from app import app"

  # ==========================================
  # DOCKER BUILD + PUSH
  # ==========================================

  docker-build:

    runs-on: ubuntu-latest
    needs: backend-checks

    outputs:
      image_tag: ${{ steps.git_sha.outputs.image_tag }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Git Commit SHA
        id: git_sha
        run: |
          echo "image_tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # ======================
      # BACKEND IMAGE
      # ======================

      - name: Build Backend Docker Image
        run: |
          docker build -t backend:${IMAGE_TAG} ./backend

      - name: Tag Backend Image
        run: |
          docker tag backend:${IMAGE_TAG} \
          920687103858.dkr.ecr.us-east-1.amazonaws.com/backend-heartdisease-and-diabetes-prediction:${IMAGE_TAG}

          docker tag backend:${IMAGE_TAG} \
          920687103858.dkr.ecr.us-east-1.amazonaws.com/backend-heartdisease-and-diabetes-prediction:latest

      - name: Push Backend Image
        run: |
          docker push 920687103858.dkr.ecr.us-east-1.amazonaws.com/backend-heartdisease-and-diabetes-prediction:${IMAGE_TAG}

          docker push 920687103858.dkr.ecr.us-east-1.amazonaws.com/backend-heartdisease-and-diabetes-prediction:latest

      # ======================
      # FRONTEND IMAGE
      # ======================

      - name: Build Frontend Docker Image
        run: |
          docker build -t frontend:${IMAGE_TAG} ./frontend

      - name: Tag Frontend Image
        run: |
          docker tag frontend:${IMAGE_TAG} \
          920687103858.dkr.ecr.us-east-1.amazonaws.com/frontend-heartdisease-and-diabetes-prediction:${IMAGE_TAG}

          docker tag frontend:${IMAGE_TAG} \
          920687103858.dkr.ecr.us-east-1.amazonaws.com/frontend-heartdisease-and-diabetes-prediction:latest

      - name: Push Frontend Image
        run: |
          docker push 920687103858.dkr.ecr.us-east-1.amazonaws.com/frontend-heartdisease-and-diabetes-prediction:${IMAGE_TAG}

          docker push 920687103858.dkr.ecr.us-east-1.amazonaws.com/frontend-heartdisease-and-diabetes-prediction:latest

      # ======================
      # UPDATE HELM VALUES
      # ======================

      - name: Update Helm values with image SHA
        run: |
          sed -i "/backend:/,/replicas:/ s/tag: .*/tag: ${IMAGE_TAG}/" mlops-chart/values.yaml
          sed -i "/frontend:/,/replicas:/ s/tag: .*/tag: ${IMAGE_TAG}/" mlops-chart/values.yaml

      - name: Commit Updated values.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mlops-chart/values.yaml

          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "Updated image tag to ${IMAGE_TAG}"

          git push

  # ==========================================
  # HELM VALIDATION
  # ==========================================

  helm-validation:

    runs-on: ubuntu-latest
    needs: docker-build

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm Chart
        run: |
          helm lint ./mlops-chart

  # ==========================================
  # DEPLOYMENT STATUS
  # ==========================================

  deployment-status:

    runs-on: ubuntu-latest
    needs: helm-validation

    steps:

      - name: Deployment Success
        run: |
          echo "CI/CD Pipeline Completed Successfully"
          echo "ArgoCD Deployment Triggered"
          echo "Images pushed to ECR"
          echo "Helm chart validated"